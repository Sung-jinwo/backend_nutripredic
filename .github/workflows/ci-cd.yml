name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # TEST & BUILD
  # ============================================
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # setup-java ya administra el cache Maven; no duplicarlo.
      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar tests
        run: ./mvnw test -B

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # INTEGRATION TESTS (con PostgreSQL)
  # ============================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: test-and-build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nutripredic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nutripredic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Esperar PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d nutripredic; then break; fi
            sleep 2
          done

      - name: Ejecutar tests de integración
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nutripredic
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw verify -B

  # ============================================
  # DEPLOY STAGING (solo main)
  # ============================================
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-and-build, integration-tests]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: |
          echo "🚀 Deploy a Staging..."
          # Aquí iría tu comando de deploy (ej. SSH, ArgoCD, Argo Rollouts, etc.)
          # Ejemplo con docker compose en servidor remoto:
          # ssh user@staging-server "cd /opt/nutripredic && docker compose pull && docker compose up -d"

  # ============================================
  # DEPLOY PRODUCTION (releases)
  # ============================================
  deploy-production:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test-and-build, integration-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploy a Producción..."
          # Tu comando de deploy a producción
          # Ej: kubectl set image deployment/nutripredic backend=ghcr.io/...:${{ github.event.release.tag_name }}
