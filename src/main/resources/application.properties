spring.application.name=nutri_predic

# Automatic demo preload requested for this project. Disable on non-demo deployments.
app.demo-seed.enabled=${DEMO_SEED_ENABLED:true}
app.demo-seed.password=${DEMO_SEED_PASSWORD:}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.ai.url=${AI_SERVICE_URL}

nutripredict.ml.base-url=${NUTRIPREDICT_ML_BASE_URL:http://localhost:8000}
nutripredict.ml.predict-path=${NUTRIPREDICT_ML_PREDICT_PATH:/predict}
nutripredict.ml.timeout=${NUTRIPREDICT_ML_TIMEOUT:PT5S}

# Contrato reproducible de extracción. La ventana es provisional y configurable.
app.variables-modelo.schema-version=variables-modelo-v4
app.variables-modelo.ventana-habitos-dias=7
app.variables-modelo.zone-id=America/Lima

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.nombre=${ADMIN_NAME}

app.gemini.api-key=${API_KEY_GEMINI}
app.gemini.base-url=${GEMINI_BASE_URL}
app.gemini.model=${GEMINI_MODEL}
app.gemini.timeout=${GEMINI_TIMEOUT}
app.gemini.mock-enabled=${GEMINI_MOCK_ENABLED}

# Free USDA key stays server-side. DEMO_KEY: 30 requests/hour and 50/day per IP.
app.food-data-central.api-key=${FDC_API_KEY:DEMO_KEY}
