version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: nutripredic-postgres
    environment:
      POSTGRES_DB: nutripredic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutripredic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutripredic-network

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutripredic-backend
    environment:
      # Base de datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nutripredic
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_JPA_OPEN_IN_VIEW: "false"
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      JWT_EXPIRATION_MS: 86400000
      
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      
      # AI Service
      AI_SERVICE_URL: http://ai:8000/predict
      
      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nutripredic.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      
      # Gemini (la app la lee como API_KEY_GEMINI — ver application.properties)
      API_KEY_GEMINI: ${API_KEY_GEMINI:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-PT30S}
      GEMINI_MOCK_ENABLED: ${GEMINI_MOCK_ENABLED:-false}
      
      # Spring profiles
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nutripredic-network

  # Servicio de IA (placeholder - implementar según necesidades)
  ai:
    image: python:3.11-slim
    container_name: nutripredic-ai
    working_dir: /app
    command: >
      sh -c "pip install fastapi uvicorn scikit-learn pandas numpy joblib &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./ai:/app
    ports:
      - "8000:8000"
    networks:
      - nutripredic-network
    profiles:
      - ai

volumes:
  postgres_data:

networks:
  nutripredic-network:
    driver: bridge